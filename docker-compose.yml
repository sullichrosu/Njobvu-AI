services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-njobvu-ai}/app:latest
    container_name: njobvu-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OLLAMA_URL=http://ollama:11434
    volumes:
      # Optional: bind-mount host config.json if present
      # - ./config.json:/app/config.json
      - ./db:/app/db
      - ./data:/app/data
      - ./public/projects:/app/public/projects

  ollama:
    image: ollama/ollama:0.32.14
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
